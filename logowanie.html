<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaloguj się - EkoDom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-logo">
            <a href="index.html"><img src="photos/logo-ekodom.jpg" alt="EkoDom"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="bazawiedzy.html">Baza wiedzy</a></li>
                <li><a href="porady.html">Porady</a></li>
                <li><a href="kalkulator.html">Kalkulator Eko</a></li>
                <li><a href="sklep.html">Sklep</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="logowanie.html" class="login-link">Zaloguj się</a>
        </div>
    </header>

    <main class="container" style="max-width: 500px; margin: 50px auto;">
        <div class="form-card">
            <h1>Zaloguj się</h1>
            <p>Uzyskaj dostęp do zapisanych kalkulacji i historii.</p>

            <form action="#" method="POST">
                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="twoj@email.pl">
                </p>
                <p>
                    <label for="password">Hasło:</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </p>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Zaloguj się</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div>
                <h3>EkoDom</h3>
                <p>&copy; 2026 EkoDom. Wszystkie prawa zastrzeżone.</p>
            </div>
        </div>
    </footer>

</body>
</html>
