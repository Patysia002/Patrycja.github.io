<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - EkoDom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-logo">
            <a href="index.html"><img src="photos/logo-ekodom.jpg" alt="EkoDom"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="bazawiedzy.html">Baza wiedzy</a></li>
                <li><a href="porady.html">Porady</a></li>
                <li><a href="kalkulator.html">Kalkulator Eko</a></li>
                <li><a href="sklep.html">Sklep</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="logowanie.html" class="login-link">Zaloguj się</a>
        </div>
    </header>

    <main class="container" style="max-width: 800px; margin: 40px auto;">
        <h1>Skontaktuj się z nami</h1>
        <p>Masz pytania, pomysły na współpracę, a może chcesz podzielić się swoją eko-historią? Napisz do nas!</p>

        <div class="form-card">
            <h2>Napisz wiadomość</h2>
            <form action="#" method="POST">
                <p>
                    <label for="imie">Imię i nazwisko:</label>
                    <input type="text" id="imie" name="imie" required placeholder="np. Jan Kowalski">
                </p>
                <p>
                    <label for="email">Adres e-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="twoj@email.pl">
                </p>
                <p>
                    <label for="temat">Temat wiadomości:</label>
                    <select id="temat" name="temat">
                        <option value="ogolne">Pytanie ogólne</option>
                        <option value="wspolpraca">Współpraca</option>
                        <option value="kalkulator">Pytanie o kalkulator</option>
                    </select>
                </p>
                <p>
                    <label for="wiadomosc">Treść wiadomości:</label>
                    <textarea id="wiadomosc" name="wiadomosc" rows="5" required placeholder="W czym możemy pomóc?"></textarea>
                </p>
                <button type="submit" class="btn btn-primary">Wyślij wiadomość</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div>
                <h3>EkoDom</h3>
                <p>&copy; 2026 EkoDom. Wszystkie prawa zastrzeżone.</p>
            </div>
        </div>
    </footer>

</body>
</html>
